# The only automated gate in this repo. It runs the trigger check and the check's own
# selftest, so a green tick means both "the descriptions still route" and "the checker can
# still fail". A checker nothing runs is a comment.
name: evals
on:
  push:
    branches: [main]
  pull_request:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 evals/trigger/run.py
      - run: python3 evals/trigger/run.py --selftest
      - run: python3 evals/cli/run.py
      # system-map's checker proves each refusal, and that hsi in this repo takes its items.
      - run: python3 skills/system-map/bin/sysmap selftest
      # Every link in the docs, on every PR. Placeholder links (example.com, in examples/)
      # are skipped by lychee's own defaults. One exclusion: dau.edu now redirects to
      # waru.edu, which sits behind a bot challenge and answered 403 to the runner on
      # main (run 36590433197, 2026-09-29) after passing on the PR run. A human browser
      # still gets the page; a check that flips on a host's bot rules is not a link check.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --verbose --no-progress
            --exclude '^https?://(www\.)?(dau|waru)\.edu/'
            './**/*.md' './**/*.html' './**/*.rst'

  # This repo is the hub a person points an agent at, and the siblings are maintained
  # separately, so the links between them are the whole join. Each sibling is cloned without
  # blobs and read at the commit the hub pins, or at its default branch when nothing is
  # pinned. A separate job, so a sibling dropping its link back does not read as an eval
  # failure here.
  siblings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: clone each sibling listed in repos.json
        run: |
          python3 -c 'import json; [print(r["name"], r["url"]) for r in json.load(open("repos.json"))["repos"]]' |
          while read -r name url; do
            git clone --quiet --filter=blob:none --no-checkout "$url" "$RUNNER_TEMP/siblings/$name"
          done
      - run: python3 evals/siblings/run.py --siblings "$RUNNER_TEMP/siblings"
      - run: python3 evals/siblings/run.py --selftest
