# The only automated gate in this repo. It runs the trigger check and the check's own
# selftest, so a green tick means both "the descriptions still route" and "the checker can
# still fail". A checker nothing runs is a comment.
name: evals
on:
  push:
    branches: [main]
  pull_request:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 evals/trigger/run.py
      - run: python3 evals/trigger/run.py --selftest
      - run: python3 evals/cli/run.py
      # Every link in the docs, on every PR. Nothing is excluded: the only placeholder links
      # (example.com, in examples/) are already skipped by lychee's own defaults.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
